<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글자취미 한주한자 부스 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Song+Myung&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
  body{ height:100dvh; overflow:hidden; -webkit-user-select:none; user-select:none; }
  .app{
    height:100dvh;
    display:flex; flex-direction:column;
    gap:var(--gap);
    padding:var(--gap) clamp(8px,2.4vw,16px);
    padding-bottom:max(var(--gap), env(safe-area-inset-bottom));
  }

  /* ── 헤더 ───────────────────────────── */
  header{
    flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:0 2px;
  }
  .today{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    padding:4px 4px 4px 8px;
    border-radius:8px;
    font-size:clamp(10px,1.45vh,12px);
    color:var(--ink-2);
    text-decoration:none;
  }
  .today b{ color:var(--ink); font-weight:600; }
  .today .arrow{ opacity:.5; }
  .sync-badge{
    display:none; align-items:center; gap:4px;
    padding:2px 7px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    font-size:clamp(9px,1.3vh,11px);
  }
  .sync-badge.on{ display:inline-flex; }
  .sync-badge .led{ width:6px; height:6px; border-radius:50%; background:#2E9E5B; }
  .sync-badge.wait .led{ background:#C98A1B; }
  .today:active{ background:var(--surface); }

  /* ── 버튼판 ─────────────────────────── */
  .board{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; gap:var(--gap);
  }
  .team{
    flex:1 1 0; min-height:0;
    display:flex; flex-direction:column; gap:calc(var(--gap) * .8);
  }
  .team-bar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:0 2px;
  }
  .team-name{
    font-size:clamp(11px,1.5vh,13px);
    font-weight:600;
    letter-spacing:.06em;
    color:var(--accent);
    display:flex; align-items:center; gap:6px;
  }
  .team-name::before{
    content:""; width:9px; height:9px; border-radius:2px;
    background:var(--accent);
  }
  .team-sub{
    margin-left:auto;
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.5vh,13px);
    color:var(--ink-2);
  }
  .team-sub b{ color:var(--ink); font-weight:600; }

  .grid{
    flex:1 1 auto; min-height:0;
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr);
    gap:var(--gap);
  }

  /* ── 상품 타일 ──────────────────────── */
  .item{
    position:relative;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    padding:clamp(6px,1.2vh,12px) clamp(8px,2vw,14px);
    border:1px solid var(--line);
    border-radius:var(--r);
    background:var(--surface);
    color:var(--ink);
    box-shadow:var(--shadow);
    font:inherit; text-align:left;
    cursor:pointer;
    transition:transform .09s ease, background-color .12s ease, border-color .12s ease;
    overflow:hidden;
  }
  .item:active{ transform:scale(.975); }
  .item:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .item .nm{ font-size:clamp(12px, 1.85vh, 16px); font-weight:500; line-height:1.25; }
  .item .pr{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(11px, 1.6vh, 14px);
    font-weight:500;
    color:var(--ink-2);
  }

  /* 마지막 줄에 빈칸이 남으면 채우기 */
  .grid .item:last-child:nth-child(even){ grid-column:span 2; }

  /* 메인 상품 */
  .item.main{
    grid-column:span 2;
    background:var(--soft);
    border-color:var(--line-accent);
  }
  .item.main .nm{ font-size:clamp(15px, 2.5vh, 21px); font-weight:700; }
  .item.main .pr{ font-size:clamp(12px, 1.8vh, 15px); color:var(--accent); }
  .item.main::after{
    content:"MAIN";
    position:absolute; top:8px; right:10px;
    font-family:"IBM Plex Mono", monospace;
    font-size:9px; letter-spacing:.16em;
    color:var(--accent); opacity:.55;
  }

  /* 담긴 상태 */
  .item.on{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .item.on .pr{ color:var(--on-accent); opacity:.75; }
  .item.on::after{ display:none; }

  .qty{
    position:absolute; top:0; right:0;
    min-width:clamp(26px,4.4vh,34px);
    height:clamp(22px,3.4vh,28px);
    padding:0 8px;
    display:none; align-items:center; justify-content:center;
    border-bottom-left-radius:12px;
    background:var(--on-accent); color:var(--accent);
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(12px,1.9vh,15px); font-weight:600;
  }
  .item.on .qty{ display:flex; }

  .minus{
    position:absolute; bottom:0; right:0;
    width:clamp(34px,5.4vh,44px); height:clamp(30px,4.6vh,38px);
    display:none; align-items:center; justify-content:center;
    border:0; border-top-left-radius:12px;
    background:rgba(255,255,255,.16); color:var(--on-accent);
    font-size:clamp(15px,2.2vh,19px); line-height:1;
    cursor:pointer;
  }
  .item.on .minus{ display:flex; }
  .minus:active{ background:rgba(255,255,255,.3); }
  .minus:focus-visible{ outline:2px solid var(--on-accent); outline-offset:-4px; }

  /* ── 합계바 ─────────────────────────── */
  .total{
    flex:0 0 auto;
    display:flex; flex-direction:column;
    gap:clamp(4px,.8vh,8px);
    padding:clamp(8px,1.4vh,14px) clamp(12px,3vw,18px) clamp(9px,1.4vh,14px);
    border-radius:var(--r);
    background:var(--ink);
    color:var(--paper);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .total-top{
    display:flex; align-items:center; gap:10px;
  }
  .total-top .cnt{
    font-size:clamp(10px,1.5vh,13px);
    opacity:.6; min-width:0; overflow:hidden; white-space:nowrap;
  }
  .acts{ margin-left:auto; display:flex; gap:8px; }
  .acts button{
    min-width:clamp(52px,13.5vw,74px);
    padding:clamp(8px,1.5vh,12px) 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.22);
    background:transparent;
    color:var(--paper);
    font:inherit;
    font-size:clamp(11px,1.6vh,13px); font-weight:500;
    cursor:pointer;
  }
  .acts button:active{ background:rgba(255,255,255,.14); }
  .acts button:disabled{ opacity:.3; cursor:default; }
  .acts button:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }
  #reset.armed{ background:var(--t2); border-color:var(--t2); color:#fff; }

  .sum{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .sum .n{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(25px, min(5.4vh, 11vw), 46px);
    font-weight:600; line-height:1; letter-spacing:-.02em;
  }
  .sum .won{ font-family:"Song Myung", serif; font-size:clamp(14px,2.2vh,20px); opacity:.7; }

  .sale{
    width:100%;
    min-height:clamp(42px,6.2vh,56px);
    border:0; border-radius:10px;
    background:var(--paper); color:var(--ink);
    font:inherit; font-size:clamp(14px,2.1vh,17px); font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .09s ease, opacity .12s ease;
  }
  .sale:active{ transform:scale(.99); }
  .sale:disabled{ opacity:.25; cursor:default; }
  .sale:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }

  /* ── 저장 알림 ──────────────────────── */
  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22vh);
    transform:translate(-50%, 8px);
    padding:12px 20px;
    border-radius:999px;
    background:var(--ink); color:var(--paper);
    font-size:14px; font-weight:600; white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,.28);
    opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* 다크에서 합계바는 밝은 판으로 뒤집기 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .total{ background:#EDEFF3; color:#15171C; }
    :root:not([data-theme="light"]) .acts button{ border-color:rgba(21,23,28,.2); color:#15171C; }
    :root:not([data-theme="light"]) .acts button:active{ background:rgba(21,23,28,.08); }
    :root:not([data-theme="light"]) #reset.armed{ background:#B03A2E; border-color:#B03A2E; color:#fff; }
    :root:not([data-theme="light"]) .sale{ background:#15171C; color:#EDEFF3; }
    :root:not([data-theme="light"]) .sale:focus-visible{ outline-color:#15171C; }
    :root:not([data-theme="light"]) .toast{ background:#EDEFF3; color:#15171C; }
  }
  :root[data-theme="dark"] .total{ background:#EDEFF3; color:#15171C; }
  :root[data-theme="dark"] .acts button{ border-color:rgba(21,23,28,.2); color:#15171C; }
  :root[data-theme="dark"] .acts button:active{ background:rgba(21,23,28,.08); }
  :root[data-theme="dark"] #reset.armed{ background:#B03A2E; border-color:#B03A2E; color:#fff; }
  :root[data-theme="dark"] .sale{ background:#15171C; color:#EDEFF3; }
  :root[data-theme="dark"] .toast{ background:#EDEFF3; color:#15171C; }

  /* 가로/태블릿: 팀을 좌우로 */
  @media (min-width:720px), (orientation:landscape) and (min-width:600px){
    .board{ flex-direction:row; }
    .team{ flex:1 1 50%; }
  }
  @media (min-width:900px){
    .app{ max-width:1100px; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="brand">글자취미<span class="x">×</span>한주한자</span>
    <a class="today" href="records.html" id="today">
      <span>오늘 <b id="todayAmt">0</b>원 · <b id="todayCnt">0</b>건</span>
      <span class="sync-badge" id="syncBadge"></span>
      <span class="arrow">›</span>
    </a>
  </header>

  <main class="board" id="board"></main>

  <div class="total">
    <div class="total-top">
      <span class="cnt" id="cnt">담긴 상품 없음</span>
      <div class="acts">
        <button id="undo" type="button" disabled>되돌리기</button>
        <button id="reset" type="button" disabled>초기화</button>
      </div>
    </div>
    <div class="sum"><span class="n" id="sum">0</span><span class="won">원</span></div>
    <button class="sale" id="sale" type="button" disabled>판매 완료</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/catalog.js"></script>
<script src="assets/store.js"></script>
<script src="assets/sync.js"></script>
<script>
(function(){
  let cart = {};
  let history = [];

  const KEY = 'booth-calc-v1';
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.cart) { cart = s.cart; history = s.history || []; }
    }
  } catch(e){}

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify({cart, history})); } catch(e){}
  }

  const board = document.getElementById('board');

  TEAMS.forEach(t => {
    const sec = document.createElement('section');
    sec.className = 'team';
    sec.style.setProperty('--accent', 'var(--' + t.key + ')');
    sec.style.setProperty('--soft', 'var(--' + t.key + '-soft)');
    sec.style.setProperty('--line-accent', 'var(--' + t.key + '-line)');
    sec.innerHTML =
      '<div class="team-bar">' +
        '<span class="team-name">' + t.name + '</span>' +
        '<span class="team-sub" id="sub-' + t.key + '">0<span style="opacity:.6">원</span></span>' +
      '</div><div class="grid"></div>';
    const grid = sec.querySelector('.grid');

    t.items.forEach(it => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (it.main ? ' main' : '');
      b.dataset.id = it.id;
      b.innerHTML =
        '<span class="qty" data-qty></span>' +
        '<span class="nm">' + it.nm + '</span>' +
        '<span class="pr">' + won(it.pr) + '원</span>' +
        '<span class="minus" role="button" tabindex="0" aria-label="' + it.nm + ' 하나 빼기">&minus;</span>';
      b.addEventListener('click', e => {
        if (e.target.closest('.minus')) return;
        add(it.id, 1);
      });
      const m = b.querySelector('.minus');
      m.addEventListener('click', e => { e.stopPropagation(); add(it.id, -1); });
      m.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); add(it.id, -1); }
      });
      grid.appendChild(b);
    });
    board.appendChild(sec);
  });

  function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

  function add(id, d){
    const next = (cart[id] || 0) + d;
    if (next < 0) return;
    if (next === 0) delete cart[id]; else cart[id] = next;
    history.push({ id, d });
    if (history.length > 200) history.shift();
    buzz(d > 0 ? 12 : 8);
    render();
  }

  const sumEl   = document.getElementById('sum');
  const cntEl   = document.getElementById('cnt');
  const undoBtn = document.getElementById('undo');
  const resetBtn= document.getElementById('reset');
  const saleBtn = document.getElementById('sale');
  const toastEl = document.getElementById('toast');

  let currentTotal = 0;

  function render(){
    let total = 0, count = 0;
    const per = { t1:0, t2:0 };

    document.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id, q = cart[id] || 0;
      el.classList.toggle('on', q > 0);
      el.querySelector('[data-qty]').textContent = q > 0 ? '×' + q : '';
      el.setAttribute('aria-label', CATALOG[id].nm + ' ' + won(CATALOG[id].pr) + '원, ' + q + '개 담김');
    });

    Object.keys(cart).forEach(id => {
      const it = CATALOG[id]; if (!it) return;
      const amt = it.pr * cart[id];
      total += amt; count += cart[id];
      per[it.team] += amt;
    });

    currentTotal = total;
    sumEl.textContent = won(total);
    cntEl.textContent = count === 0 ? '담긴 상품 없음' : '담긴 상품 ' + count + '개';

    TEAMS.forEach(t => {
      document.getElementById('sub-' + t.key).innerHTML =
        '<b>' + won(per[t.key]) + '</b><span style="opacity:.6">원</span>';
    });

    undoBtn.disabled = history.length === 0;
    resetBtn.disabled = count === 0;
    saleBtn.disabled = count === 0;
    saleBtn.textContent = count === 0 ? '판매 완료' : '판매 완료 · ' + won(total) + '원';
    if (count === 0) disarm();
    save();
  }

  function refreshToday(){
    const s = Store.todaySummary();
    document.getElementById('todayAmt').textContent = won(s.total);
    document.getElementById('todayCnt').textContent = s.sales;
  }

  const badge = document.getElementById('syncBadge');
  function paintSync(st){
    badge.className = 'sync-badge';
    if (!st.enabled) return;
    badge.classList.add('on');
    if (st.pending){
      badge.classList.add('wait');
      badge.innerHTML = '<i class="led"></i>대기 ' + st.pending;
    } else {
      badge.innerHTML = '<i class="led"></i>시트';
    }
  }

  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }

  undoBtn.addEventListener('click', () => {
    const last = history.pop();
    if (!last) return;
    const next = (cart[last.id] || 0) - last.d;
    if (next <= 0) delete cart[last.id]; else cart[last.id] = next;
    buzz(8);
    render();
  });

  saleBtn.addEventListener('click', () => {
    const lines = Object.keys(cart).map(id => ({ id, qty: cart[id] }));
    if (!lines.length) return;
    const amount = currentTotal;
    const rec = Store.add(lines);
    if (!rec){
      toast('저장 실패 — 브라우저 저장공간을 확인해 주세요');
      return;
    }
    cart = {}; history = [];
    disarm(); buzz(24); render(); refreshToday();
    toast('저장 완료 · ' + won(amount) + '원');
    Sync.flush();
  });

  let armed = false, armTimer = null;
  function disarm(){
    armed = false;
    clearTimeout(armTimer);
    resetBtn.classList.remove('armed');
    resetBtn.textContent = '초기화';
  }
  resetBtn.addEventListener('click', () => {
    if (!armed){
      armed = true;
      resetBtn.classList.add('armed');
      resetBtn.textContent = '한 번 더';
      armTimer = setTimeout(disarm, 2500);
      return;
    }
    cart = {}; history = [];
    disarm(); buzz(20); render();
  });

  render();
  refreshToday();
  Sync.onChange(paintSync);
  Sync.start();
  /* 기록 페이지에서 수정하고 돌아왔을 때 오늘 합계를 다시 읽습니다. */
  window.addEventListener('pageshow', refreshToday);
})();
</script>
</body>
</html>
